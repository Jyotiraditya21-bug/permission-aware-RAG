name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e .
          uv pip install --system ruff pytest pytest-asyncio
          
      - name: Lint with ruff
        run: ruff check src/ tests/ evals/
        
      - name: Run pytest
        run: pytest -v tests/
        
      - name: Run evals
        run: python evals/run_evals.py
